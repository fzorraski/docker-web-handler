#to linux/mac
docker.host=unix:///var/run/docker.sock
docker.connect-timeout=30000
docker.response-timeout=45000

# Comma-separated list of repositories allowed to run (e.g. nginx,tensorflow/tensorflow)
# Override with env variable: ALLOWED_RUN_REPOSITORIES
allowed.run.repositories=

# Default registry config (leave empty for Docker Hub, used as fallback)
# Override with env variables: DOCKER_REGISTRY_URL, DOCKER_REGISTRY_USERNAME, DOCKER_REGISTRY_PASSWORD
#docker.registry.url=
docker.registry.username=
docker.registry.password=

# Per-repository registry credentials (takes precedence over the default above)
# Use pipe (|) to configure multiple registries. Empty segment = Docker Hub.
# Example: |https://registry2.com  means Docker Hub first, then registry2
# Override with env variables: REPOSITORY_REGISTRY_URL_<REPO_NAME>, REPOSITORY_REGISTRY_USERNAME_<REPO_NAME>, REPOSITORY_REGISTRY_PASSWORD_<REPO_NAME>
#repository.registry-url.mywms-spk=|https://registry2.example.com
#repository.registry-username.mywms-spk=hubuser|privuser
#repository.registry-password.mywms-spk=hubpass|privpass

# Per-repository default env var keys with optional default values (comma-separated KEY=VALUE pairs)
# Override with env variable: REPOSITORY_ENV_KEYS_<REPO_NAME> (dots replaced by underscores)
repository.env-keys.mywms-spk=

# Per-repository hidden env vars (automatically injected, invisible to users, cannot be overridden)
# Format: comma-separated KEY=VALUE pairs
# Override with env variable: REPOSITORY_HIDDEN_ENV_<REPO_NAME> (dots replaced by underscores)
repository.hidden-env.mywms-spk=

# Enable container memory limit field in the UI (default: false)
# Override with env variable: CONTAINER_MEMORY_LIMIT_ENABLED
container.memory-limit.enabled=false

# Per-repository Java opts env var name (if set, JAVA_OPTS is auto-generated from memory limit)
# Override with env variable: REPOSITORY_JAVA_OPTS_VAR_<REPO_NAME>
#repository.java-opts-var.mywms-spk=JAVA_OPTS

# Automatic port mapping (default: false)
# Override with env variable: CONTAINER_PORT_MAPPING_ENABLED
container.port-mapping.enabled=false

# Host port search threshold (ports are scanned starting from this value)
# Override with env variable: CONTAINER_PORT_MAPPING_HOST_PORT_START
container.port-mapping.host-port-start=10000

# Per-repository container ports to map (comma-separated)
# Override with env variable: REPOSITORY_CONTAINER_PORTS_<REPO_NAME>
#repository.container-ports.mywms-spk=8080,9990

# Per-repository port hyperlink paths (appended to port links in the UI)
# Format: containerPort:path pairs, comma-separated
# Override with env variable: REPOSITORY_PORT_PATHS_<REPO_NAME>
#repository.port-paths.mywms-spk=8080:/foo

# Container expiration persistence (JSON file path)
# Override with env variable: EXPIRATION_STORAGE_FILE
expiration.storage.file=data/expirations.json

# Default container expiration in minutes (e.g. 480 = 8 hours)
# Override with env variable: CONTAINER_DEFAULT_EXPIRATION_MINUTES
container.default-expiration-minutes=480

# UI locale for date/time pickers (e.g. pt-br, en, es). Omit for browser default.
# Override with env variable: UI_LOCALE
#ui.locale=pt-br

# Database listing — show available PostgreSQL databases during container creation (default: false)
# Override with env variable: DATABASE_LISTING_ENABLED
database.listing.enabled=false

# Database deletion on expiration — auto-drop the selected database when a container expires (default: false)
# Requires: database.listing.enabled=true, per-repository PG host configured, and a database selected during creation
# Override with env variable: DATABASE_DELETION_ON_EXPIRATION_ENABLED
database.deletion-on-expiration.enabled=false

# Per-repository PostgreSQL connection for database listing
# Override with env variables: REPOSITORY_PG_HOST_<REPO>, REPOSITORY_PG_PORT_<REPO>,
#   REPOSITORY_PG_USER_<REPO>, REPOSITORY_PG_PASSWORD_<REPO>, REPOSITORY_PG_DB_ENV_VAR_<REPO>
#repository.pg-host.mywms-spk=localhost
#repository.pg-port.mywms-spk=5432
#repository.pg-user.mywms-spk=postgres
#repository.pg-password.mywms-spk=secret
#repository.pg-db-env-var.mywms-spk=DB_NAME
# PostgreSQL Docker image for restore (creates an ephemeral container, removed after use)
# Set to "none" to use local psql/pg_restore instead. Default: postgres:latest
# Override with env variable: REPOSITORY_PG_IMAGE_<REPO>
#repository.pg-image.mywms-spk=postgres:16

# Database dump upload & restore feature (default: disabled)
# Override with env variables: DATABASE_DUMP_ENABLED, DATABASE_DUMP_UPLOAD_PASSWORD,
#   DATABASE_DUMP_OPERATIONS_PASSWORD, DATABASE_DUMP_STORAGE_DIR, DATABASE_DUMP_MAX_SIZE_MB,
#   DATABASE_DUMP_METADATA_FILE
database.dump.enabled=false
database.dump.upload-password=
database.dump.operations-password=
database.dump.storage.dir=data/dumps/
database.dump.max-size-mb=1500
database.dump.metadata.file=data/dumps-metadata.json

# Post-restore SQL scripts (default: disabled)
# Override with env variables: POST_RESTORE_SCRIPTS_ENABLED, POST_RESTORE_SCRIPTS_ON_FAILURE
post-restore-scripts.enabled=true
# Behavior on script failure: "stop" or "continue"
post-restore-scripts.on-failure=stop

# Per-repository post-restore script directories
# Override with env variables: REPOSITORY_POST_RESTORE_MANDATORY_DIR_<REPO>, REPOSITORY_POST_RESTORE_OPTIONAL_DIR_<REPO>
repository.post-restore-mandatory-dir.mywms-spk=data/scripts/mywms-spk/mandatory
repository.post-restore-optional-dir.mywms-spk=data/scripts/mywms-spk/optional

# Max upload body size (500 MB for dump uploads)
quarkus.http.limits.max-body-size=1524288000

# REST API base path (avoids collision with SPA routes)
quarkus.resteasy.path=/api

# Quinoa (React frontend)
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=5173
